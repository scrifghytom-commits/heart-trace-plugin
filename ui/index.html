<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>心迹日记</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-blur"></div>
    
    <div class="notebook-container">
        <!-- 顶部标题栏 -->
        <div class="header">
            <span class="date-label" id="ui-date">日记详情</span>
            <div class="header-actions">
                <span id="edit-btn" class="action-btn" onclick="toggleEdit()">编辑</span>
                <span class="close-btn" onclick="closePage()">关闭</span>
            </div>
        </div>

        <!-- 核心内容区 -->
        <div class="paper-sheet" id="diary-view">
            <div class="empty-state">正在翻开日记...</div>
        </div>

        <!-- 编辑区域 -->
        <div class="paper-sheet edit-mode hidden" id="diary-edit">
            <div class="edit-field">
                <label>标题</label>
                <input type="text" id="edit-title" class="edit-input">
            </div>
            <div class="edit-field">
                <label>心情标签</label>
                <input type="text" id="edit-mood" class="edit-input">
            </div>
            <div class="edit-field">
                <label>高亮语录</label>
                <input type="text" id="edit-quote" class="edit-input">
            </div>
            <div class="edit-field">
                <label>正文</label>
                <textarea id="edit-content" class="edit-textarea" rows="10"></textarea>
            </div>
            <button class="save-btn" onclick="saveDiary()">保存修改</button>
        </div>
    </div>

    <script>
        // 环境兼容：如果网页版直接打开，使用 localStorage 模拟 Bridge
        const isWeb = typeof Bridge === 'undefined';
        let currentEntry = null;
        let isEditing = false;

        // 降级 Bridge API
        const BridgeAPI = {
            get: (key) => isWeb ? localStorage.getItem(key) : Bridge.dataStoreGet(key),
            set: (key, val) => isWeb ? localStorage.setItem(key, val) : Bridge.dataStoreSet(key, val),
            callJS: (func, params) => isWeb ? console.log("Web 模式模拟调用:", func, params) : Bridge.callJSFunction(func, params)
        };

        window.onload = function() {
            // 1. 优先从 URL 参数获取 id
            const urlParams = new URLSearchParams(window.location.search);
            const idFromUrl = urlParams.get('id');

            if (idFromUrl) {
                const rawData = BridgeAPI.get(idFromUrl);
                if (rawData) {
                    renderDiary(JSON.parse(rawData));
                    return;
                }
            }

            // 2. 没有 URL 参数则从最新一篇加载
            const latestKey = BridgeAPI.get("latest_diary_key");
            if (latestKey) {
                const rawData = BridgeAPI.get(latestKey);
                if (rawData) {
                    renderDiary(JSON.parse(rawData));
                    return;
                }
            }

            // 3. 空状态
            document.getElementById('diary-view').innerHTML = '<div class="empty-state">还没有留下心迹哦。</div>';
        };

        function renderDiary(data) {
            currentEntry = data;
            document.getElementById('ui-date').innerText = "日记详情 - " + data.date;
            
            let quoteHtml = (data.quote && data.quote.trim() !== "") 
                ? `<div class="highlight-quote">${data.quote}</div>` 
                : "";
            
            let paragraphs = data.content.split('\n').map(p => `<p>${p}</p>`).join('');

            document.getElementById('diary-view').innerHTML = `
                <div class="title-row">
                    <h1 class="handwritten-title">${data.title}</h1>
                    <div class="mood-tag" style="transform: rotate(${data.rotation || 1}deg);">${data.mood}</div>
                </div>
                ${quoteHtml}
                <div class="diary-text">${paragraphs}</div>
                <div class="footer-mark">—— 橘瓣 · 心迹</div>
            `;

            // 填充编辑表单
            document.getElementById('edit-title').value = data.title;
            document.getElementById('edit-mood').value = data.mood;
            document.getElementById('edit-quote').value = data.quote || "";
            document.getElementById('edit-content').value = data.content;
        }

        function toggleEdit() {
            if (!currentEntry) return;
            isEditing = !isEditing;
            const view = document.getElementById('diary-view');
            const editArea = document.getElementById('diary-edit');
            const editBtn = document.getElementById('edit-btn');

            if (isEditing) {
                view.classList.add('hidden');
                editArea.classList.remove('hidden');
                editBtn.innerText = "取消";
            } else {
                view.classList.remove('hidden');
                editArea.classList.add('hidden');
                editBtn.innerText = "编辑";
            }
        }

        function saveDiary() {
            if (!currentEntry) return;
            
            const newData = {
                ...currentEntry,
                title: document.getElementById('edit-title').value,
                mood: document.getElementById('edit-mood').value,
                quote: document.getElementById('edit-quote').value,
                content: document.getElementById('edit-content').value
            };

            // 调用后台更新 (在橘瓣内)，并更新本地 UI
            if (!isWeb) {
                BridgeAPI.callJS("update_diary", JSON.stringify(newData));
            } else {
                // Web 模拟保存
                BridgeAPI.set(newData.id, JSON.stringify(newData));
                BridgeAPI.set("latest_diary_key", newData.id);
            }

            currentEntry = newData;
            renderDiary(newData);
            toggleEdit(); // 退出编辑模式
        }

        function closePage() {
            if (!isWeb) {
                Bridge.callNative("finish");
            } else {
                alert("网页模式下点击了关闭");
            }
        }
    </script>
</body>
</html>
