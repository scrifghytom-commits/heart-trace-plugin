<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>心迹日记本</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 列表页专属样式，修正排版 */
        body { background-color: #e5e3df; margin: 0; padding: 0; }
        .list-container { padding: 20px; max-width: 500px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; color: #333;}
        .main-title { font-size: 20px; font-family: "Kaiti SC", "STKaiti", serif; margin: 0;}
        .add-btn { background: #8f9d89; color: #fff; border: none; padding: 8px 16px; border-radius: 20px; font-size: 14px;}
        .diary-card {
            background: #fcfaf5; padding: 16px; border-radius: 8px; margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); text-decoration: none; display: block; color: inherit;
        }
        .card-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .card-title { font-size: 18px; font-weight: bold; font-family: "Kaiti SC", serif; color: #2c2c2c;}
        .card-mood { background: #f2e8b3; padding: 2px 8px; font-size: 12px; border-radius: 4px; color: #665c3b;}
        .card-preview { font-size: 14px; color: #666; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-footer { font-size: 12px; color: #aaa; margin-top: 10px; text-align: right;}
        .empty-state { text-align: center; color: #999; margin-top: 50px; }
    </style>
</head>
<body>
    <div class="list-container">
        <div class="header">
            <h1 class="main-title">📜 心迹日记本</h1>
        </div>
        <div id="diary-list">
            <div class="empty-state">正在翻阅...</div>
        </div>
    </div>

    <script>
        window.onload = function() {
            if (typeof Bridge === 'undefined') {
                document.getElementById('diary-list').innerHTML = '<div class="empty-state">请在橘瓣 App 内打开此页面。</div>';
                return;
            }

            // 调用 main.js 获取数据
            try {
                var resStr = Bridge.callJSFunction("get_all_diaries", "{}");
                console.log("获取到数据:", resStr);
                
                // 解析返回的 JSON
                var res = JSON.parse(resStr);
                if (!res.success || !res.data) {
                    document.getElementById('diary-list').innerHTML = '<div class="empty-state">暂无日记哦。</div>';
                    return;
                }

                var diaries = JSON.parse(res.data);
                if (diaries.length === 0) {
                    document.getElementById('diary-list').innerHTML = '<div class="empty-state">还没有日记，去找 AI 写一篇吧！</div>';
                    return;
                }

                var html = '';
                for (var i = 0; i < diaries.length; i++) {
                    var d = diaries[i];
                    var preview = (d.content || "").replace(/\n/g, ' ').substring(0, 40) + '...';
                    html += `
                        <a href="ui/index.html?id=${d.id}" class="diary-card">
                            <div class="card-header">
                                <span class="card-title">${d.title}</span>
                                <span class="card-mood">${d.mood}</span>
                            </div>
                            <div class="card-preview">${preview}</div>
                            <div class="card-footer">${d.date}</div>
                        </a>
                    `;
                }
                document.getElementById('diary-list').innerHTML = html;
            } catch(e) {
                console.error(e);
                document.getElementById('diary-list').innerHTML = '<div class="empty-state">读取失败: ' + e.message + '</div>';
            }
        };
    </script>
</body>
</html>
